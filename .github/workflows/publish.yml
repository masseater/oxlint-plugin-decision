name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGES: >-
        libs/oxlint-plugin-decision
        libs/oxlint-plugin-decision-presets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Check tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for dir in $PACKAGES; do
            if [ ! -d "$dir" ]; then
              echo "::warning::$dir does not exist, skipping"
              continue
            fi
            version="$(jq -r .version "$dir/package.json")"
            if [ "$TAG" != "v$version" ]; then
              echo "::error::Tag $TAG does not match $dir version v$version"
              exit 1
            fi
          done
      - run: vp run verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for dir in $PACKAGES; do
            [ -d "$dir" ] || continue
            (cd "$dir" && vp pm pack --out "$RUNNER_TEMP/packages/$(basename "$dir").tgz")
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          for dir in $PACKAGES; do
            [ -d "$dir" ] || continue
            name="$(jq -r .name "$dir/package.json")"
            version="$(jq -r .version "$dir/package.json")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish "$RUNNER_TEMP/packages/$(basename "$dir").tgz" --provenance --access public
          done
