catalogMode: prefer

catalog:
  "@ast-grep/cli": 0.45.3
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@oxlint/plugins": 1.87.0
  "@types/node": 26.6.5
  "@typesafe-ai/sdk": 0.6.0
  eslint-plugin-no-comments: 1.2.1
  oxlint: 1.87.0
  synckit: 0.12.1
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
catalogs:
  stack:
    fallow: 3.32.0
    typescript: 7.0.2
    vite-plus: 1.1.0
overrides:
